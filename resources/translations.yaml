# Translations for checking the arguments definition for keyword arguments.
Error arg def option id:
  en: >
    Error: The option with the identifier "$1" does not use a valid Bash
    identifier.
  de: >
    Fehler: Die Option mit dem Identifikator "$1" nutzt keinen validen
