# General translations.
Help description:
  en: Command-line program.
  de: Kommandozeilenprogramm.

Subcommands:
  en: Subcommands
  de: Subkommandos

Positional arguments:
  en: Positional arguments
  de: Positionale Argumente

Help options:
  en: Help options
  de: Hilfsoptionen

Usage:
  en: Usage
  de: Aufruf

Version:
  en: Version
  de: Version

Error:
  en: Error
  de: Fehler

Errors:
  en: Errors
  de: Fehler

Warning:
  en: Warning
  de: Warnung

Warnings:
  en: Warnings
  de: Warnungen

# Translations for help messages.
Arguments:
  en: ARGUMENTS
  de: ARGUMENTE

Options:
  en: OPTIONS
  de: OPTIONEN

Mandatory arguments:
  en: >
    Mandatory arguments to long options are mandatory for short options too.
  de: >
    Erforderliche Argumente für lange Optionen sind auch für kurze
    erforderlich.

Deprecated:
  en: DEPRECATED
  de: VERALTET

Default:
  en: default
  de: Vorgabe

true:
  en: true
  de: wahr

false:
  en: false
  de: falsch

--help:
  en: display this help and exit
  de: diese Hilfe anzeigen und beenden

--usage:
  en: display the usage and exit
  de: den Aufruf anzeigen und beenden

--version:
  en: display the version and exit
  de: die Version anzeigen und beenden

Error include directive:
  en: >
    Error: The include directive "$1" could not be recognized.
  de: >
    Fehler: Die Include-Anweisung "$1" konnte nicht erkannt werden.

# Translations for checking the environment variables.
Error env var bool:
  en: >
    Error: The environment variable "$1" is set to "$2", but must be a Boolean,
    i.e., "true" or "false".
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, muss aber ein
    boolscher Wert (Boolean) sein, d. h. "wahr" ("true") oder "falsch"
    ("false").

Error env var char:
  en: >
    Error: The environment variable "$1" is set to "$2", but must be a
    character, i.e., a string comprising one printable ASCII character.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, muss aber ein
    einzelnes Zeichen sein, d. h. eine Zeichenkette aus einem druckbaren
    ASCII-Zeichen.

Error env var identifier:
  en: >
    Error: The environment variable "$1" is set to "$2", but designed to be
    used as Bash variable identifier, i.e., its value must start with a letter
    or underscore and contain only letters, digits, and underscores.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, aber zur
    Verwendung als Variablenidentifikator für Bash vorgesehen, d. h. ihr Wert
    muss mit einem Buchstaben oder Unterstrich beginnen und nur aus Buchstaben,
    Ziffern und Unterstrichen bestehen.

Error env var int:
  en: >
    Error: The environment variable "$1" is set to "$2", but must be an
    integer, i.e., comprise only digits and possibly a leading sign.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, muss aber eine
    Ganzzahl sein, d. h. nur Ziffern und ggf. ein Vorzeichen umfassen.

Error env var uint:
  en: >
    Error: The environment variable "$1" is set to "$2", but must be an
    unsigned integer, i.e., comprise only digits and no sign.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, muss aber eine
    natürliche Zahl sein, d. h. nur Ziffern und kein Vorzeichen umfassen.

Error env var file 0001:
  en: >
    Error: The environment variable "$1" is set to "$2", but the referenced
    file is empty.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, die referenzierte
    Datei ist aber leer.

Error env var file 0010:
  en: >
    Error: The environment variable "$1" is set to "$2", but the referenced
    file is not readable.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, die referenzierte
    Datei ist aber nicht lesbar.

Error env var file 0011:
  en: >
    Error: The environment variable "$1" is set to "$2", but the referenced
    file is not readable and empty.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, die referenzierte
    Datei ist aber nicht lesbar und leer.

Error env var file 0100:
  en: >
    Error: The environment variable "$1" is set to "$2", but the referenced
    file is not a regular file.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, die referenzierte
    Datei ist aber keine reguläre Datei.

Error env var file 0101:
  en: >
    Error: The environment variable "$1" is set to "$2", but the referenced
    file is not a regular file and empty.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, die referenzierte
    Datei ist aber keine reguläre Datei und leer.

Error env var file 0110:
  en: >
    Error: The environment variable "$1" is set to "$2", but the referenced
    file is not a regular file and not readable.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, die referenzierte
    Datei ist aber keine reguläre Datei und nicht lesbar.

Error env var file 0111:
  en: >
    Error: The environment variable "$1" is set to "$2", but the referenced
    file is not a regular file, not readable, and empty.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, die referenzierte
    Datei ist aber keine reguläre Datei, nicht lesbar und leer.

Error env var file 1111:
  en: >
    Error: The environment variable "$1" is set to "$2", but the referenced
    file does not exist.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, die referenzierte
    Datei existiert aber nicht.

Error env var delimiters reserved:
  en: >
    Error: The environment variable "$1" is set to "$2", but hyphens, plus
    signs, asterisks, and question marks are reserved characters.
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, Bindestriche,
    Pluszeichen, Sternchen und Fragezeichen sind aber reservierte Zeichen.

Error env var styles:
  en: >
    Error: The environment variable "$1" is set to "$2", but the values must
    lie in {$3} for colors and in {$4} for styles.  Colors, only, may be
    prefixed by "bright_" or suffixed by "_fg" or "_bg".
  de: >
    Fehler: Die Umgebungsvariable "$1" ist auf "$2" gesetzt, die Werte müssen
    aber in {$3} für Farben und in {$4} für Stile liegen.  Ausschließlich
    Farben können mit dem Präfix "bright_" ("hell_") oder dem Suffix "_fg"
    (Vordergrund) oder "_bg" (Hintergrund) gegeben werden.

Error env var style usage:
  en: >
    Error: The environment variable "ARGPARSER_USE_STYLES" must be in {$1}, but
    is "$2".
  de: >
    Fehler: Die Umgebungsvariable "ARGPARSER_USE_STYLES" muss in {$1} liegen,
    ist aber "$2".

Error env var option type:
  en: >
    Error: The environment variable "ARGPARSER_USAGE_MESSAGE_OPTION_TYPE" must
    be either set to "long" or "short", but is "$1".
  de: >
    Fehler: Die Umgebungsvariable "ARGPARSER_USAGE_MESSAGE_OPTION_TYPE" muss
    entweder auf "long" ("lang") oder "short" ("kurz") gesetzt sein, ist aber
    "$1".

Error env var orientation:
  en: >
    Error: The environment variable "ARGPARSER_USAGE_MESSAGE_ORIENTATION" must
    be either set to "row" or "column", but is "$1".
  de: >
    Fehler: Die Umgebungsvariable "ARGPARSER_USAGE_MESSAGE_ORIENTATION" muss
    entweder auf "row" ("Zeile") oder "column" ("Spalte") gesetzt sein, ist
    aber "$1".

Error env var delimiters identical:
  en: >
    Error: The environment variables "ARGPARSER_ARG_DELIMITER_1" and
    "ARGPARSER_ARG_DELIMITER_2" must have different values, but are both "$1".
  de: >
    Fehler: Die Umgebungsvariablen "ARGPARSER_ARG_DELIMITER_1" und
    "ARGPARSER_ARG_DELIMITER_2" müssen unterschiedliche Werte haben, sind aber
    beide "$1".

Error env var option name empty:
  en: >
    Error: The environment variable "$1" has an empty string given as one of
    the $2 option names, instead of a legit name.
  de: >
    Fehler: Die Umgebungsvariable "$1" hat einen Leerstring als einen der $2
    Optionsnamen gegeben, statt einen zulässigen Namen.

Error env var option name duplication 1:
  en: >
    Error: The environment variable "$1" has the short option "-$2" given $3
    times.
  de: >
    Fehler: Die Umgebungsvariable "$1" hat die kurze Option "-$2" $3-mal
    gegeben.

Error env var option name duplication 2:
  en: >
    Error: The environment variable "$1" has the long option "--$2" given $3
    times.
  de: >
    Fehler: Die Umgebungsvariable "$1" hat die lange Option "--$2" $3-mal
    gegeben.

Error env var option name duplication 3:
  en: >
    Error: The environment variable "$1" has the short option "-$2" given, but
    that is already in use by "$3".
  de: >
    Fehler: Die Umgebungsvariable "$1" hat die kurze Option "-$2" gegeben,
    diese wird aber bereits von "$3" genutzt.

Error env var option name duplication 4:
  en: >
    Error: The environment variable "$1" has the long option "--$2" given, but
    that is already in use by "$3".
  de: >
    Fehler: Die Umgebungsvariable "$1" hat die lange Option "--$2" gegeben,
    diese wird aber bereits von "$3" genutzt.

Error env var short options:
  en: >
    Error: The environment variable "ARGPARSER_USAGE_MESSAGE_OPTION_TYPE"
    requests the usage of short option names, but "ARGPARSER_USE_SHORT_OPTIONS"
    turns them off.
  de: >
    Fehler: Die Umgebungsvariable "ARGPARSER_USAGE_MESSAGE_OPTION_TYPE" fordert
    die Nutzung kurzer Optionsnamen, "ARGPARSER_USE_SHORT_OPTIONS" deaktiviert
    diese aber.

Error env var long options:
  en: >
    Error: The environment variable "ARGPARSER_USAGE_MESSAGE_OPTION_TYPE"
    requests the usage of long option names, but "ARGPARSER_USE_LONG_OPTIONS"
    turns them off.
  de: >
    Fehler: Die Umgebungsvariable "ARGPARSER_USAGE_MESSAGE_OPTION_TYPE" fordert
    die Nutzung langer Optionsnamen, "ARGPARSER_USE_LONG_OPTIONS" deaktiviert
    diese aber.

Error env var files:
  en: >
    Error: The environment variables "$1" and "$2" point to the same file.
  de: >
    Fehler: Die Umgebungsvariablen "$1" und "$2" verweisen auf dieselbe Datei.

Error env var negation prefix empty:
  en: >
    Error: The environment variable "ARGPARSER_FLAG_NEGATION_PREFIXES" has an
    empty string given as prefix, instead of a legit prefix.
  de: >
    Fehler: Die Umgebungsvariable "ARGPARSER_FLAG_NEGATION_PREFIXES" hat einen
    Leerstring als Präfix gegeben, statt ein zulässiges Präfix.

# Translations for reading and translating from the translation file.
Error YAML:
  en: >
    Error: The YAML line "$1" could not be recognized.
  de: >
    Fehler: Die YAML-Zeile "$1" konnte nicht erkannt werden.

Warning no identifier:
  en: >
    Warning: In the translation file "$1", the identifier "$2" is missing.  For
    convenience, the untranslated string is used, instead.
  de: >
    Warnung: In der Übersetzungsdatei "$1" fehlt der Identifikator
    "$2".  Zwecks Benutzerfreundlichkeit wird stattdessen die nicht übersetzte
    Zeichenkette genutzt.

Warning no translation:
  en: >
    Warning: In the translation file "$1", the translation to "$2" for the
    identifier "$3" is missing.  For convenience, the untranslated string is
    used, instead.
  de: >
    Warnung: In der Übersetzungsdatei "$1" fehlt die Übersetzung nach "$2" für
    den Identifikator "$3".  Zwecks Benutzerfreundlichkeit wird stattdessen die
    nicht übersetzte Zeichenkette genutzt.

# Translations for reading the style file.
Warning style file message key:
  en: >
    Warning: In the style file "$1", the line "$2" sets a non-existent message
    key.
  de: >
    Warnung: In der Stildatei "$1" setzt die Zeile "$2" einen inexistenten
    Nachrichten-Schlüssel.

Error style file equals sign:
  en: >
    Error: In the style file "$1", the line "$2" doesn't contain an equals sign
    ("="), nor is it empty or commented.
  de: >
    Fehler: In der Stildatei "$1" enthält die Zeile "$2" kein
    Gleichheitszeichen ("=") und ist auch nicht leer oder auskommentiert.

Error style file frame styles:
  en: >
    Error: The style "$1" is set to "$2", but the values must lie in {$3} for
    colors and in {$4} for frame styles.  Colors, only, may be prefixed by
    "bright_" or suffixed by "_fg" or "_bg".
  de: >
    Fehler: Der Stil "$1" ist auf "$2" gesetzt, die Werte müssen aber in
    {$3} für Farben und in {$4} für Rahmenstile liegen.  Ausschließlich Farben
    können mit dem Präfix "bright_" ("hell_") oder dem Suffix "_fg"
    (Vordergrund) oder "_bg" (Hintergrund) gegeben werden.

Error style file text styles:
  en: >
    Error: The style "$1" is set to "$2", but the values must lie in {$3} for
    colors and in {$4} for text styles.  Colors, only, may be prefixed by
    "bright_" or suffixed by "_fg" or "_bg".
  de: >
    Fehler: Der Stil "$1" ist auf "$2" gesetzt, die Werte müssen aber in
    {$3} für Farben und in {$4} für Textstile liegen.  Ausschließlich Farben
    können mit dem Präfix "bright_" ("hell_") oder dem Suffix "_fg"
    (Vordergrund) oder "_bg" (Hintergrund) gegeben werden.

# Translations for reading the arguments definition.
Error arg array 1:
  en: >
    Error: Calling (instead of sourcing) the Argparser requires the arguments
    definition to be provided through STDIN, separated by newlines.  Either
    pipe to the Argparser or use process substitution to give
    input.  Alternatively, try "$1 --help" to get a help message with further
    information.
  de: >
    Fehler: Das Aufrufen (statt Ausführen per source) des Argparsers erfordert,
    dass die Argumentdefinition per STDIN gegeben wird, getrennt durch
    Zeilenvorschübe.  Entweder lege eine Pipe zum Argparser oder nutze
    Prozesssubstitution für die Eingabe.  Probiere alternativ "$1 --help", um
    eine Hilfsnachricht mit weiterer Information zu erhalten.

Error arg array 2:
  en: >
    Error: The variable ARGPARSER_ARG_ARRAY_NAME refers to "$1", but this
    variable is not defined.  Either you have given your arguments array
    another name (maybe "$2" -- then change ARGPARSER_ARG_ARRAY_NAME
    accordingly) or you forgot defining the array at all (then define it).
  de: >
    Fehler: Die Variable ARGPARSER_ARG_ARRAY_NAME bezieht sich auf "$1", diese
    Variable ist aber nicht definiert.  Entweder hast du dem Argumente-Array
    einen anderen Namen gegeben (vielleicht "$2" -- dann ändere
    ARGPARSER_ARG_ARRAY_NAME entsprechend) oder du hast vergessen, das Array
    überhaupt zu definieren (dann definiere es).

Error arg array 3:
  en: >
    Error: The variable ARGPARSER_ARG_ARRAY_NAME refers to "$1", but this
    variable is not defined.  Either you have given your arguments array
    another name (then change ARGPARSER_ARG_ARRAY_NAME accordingly) or you
    forgot defining the array at all (then define it).
  de: >
    Fehler: Die Variable ARGPARSER_ARG_ARRAY_NAME bezieht sich auf "$1", diese
    Variable ist aber nicht definiert.  Entweder hast du dem Argumente-Array
    einen anderen Namen gegeben (dann ändere ARGPARSER_ARG_ARRAY_NAME
    entsprechend) oder du hast vergessen, das Array überhaupt zu definieren
    (dann definiere es).

Error no arg def:
  en: >
    Error: No argument definition for "$1".
  de: >
    Fehler: Keine Argumentdefinition für "$1".

# Translations for parsing the arguments definition.
Error arg def id:
  en: >
    Error: In the arguments definition in "$1", the column "id" is missing.
  de: >
    Fehler: In der Argumentdefinition in "$1" fehlt die Spalte "id".

Error arg def file id:
  en: >
    Error: In the arguments definition file "$1", the column "id" is missing.
  de: >
    Fehler: In der Argumentdefinitionsdatei "$1" fehlt die Spalte "id".

Error arg def field count:
  en: >
    Error: In the arguments definition in "$1", the field count of the line
    "$2" ($3) doesn't match the header's field count ($4).
  de: >
    Fehler: In der Argumentdefinition in "$1" stimmt die Anzahl Felder der
    Zeile "$2" ($3) nicht mit der Anzahl Felder in der Überschrift ($4)
    überein.

Error arg def file field count:
  en: >
    Error: In the arguments definition file "$1", the field count of the line
    "$2" ($3) doesn't match the header's field count ($4).
  de: >
    Fehler: In der Argumentdefinitionsdatei "$1" stimmt die Anzahl Felder der
    Zeile "$2" ($3) nicht mit der Anzahl Felder in der Überschrift ($4)
    überein.

Error arg def choice range hyphens:
  en: >
    Error: The argument with the identifier "$1" has more hyphens in the choice
    values given than supported (2).
  de: >
    Fehler: Das Argument mit dem Identifikator "$1" hat mehr Bindestriche in
    den Auswahlwerten gegeben als unterstützt.

Error arg def choice range:
  en: >
    Error: The argument with the identifier "$1" has choice values given with
    "$2" as start, "$3" as stop, and "$4" as step size, while only integer,
    float, or letter sequences are supported.
  de: >
    Fehler: Das Argument mit dem Identifikator "$1" hat Auswahlwerte gegeben
    mit "$2" als Start, "$3" als Stopp, und "$4" als Schrittweite, während nur
    Ganzzahl-, Gleitkommazahl- und Buchstaben-Sequenzen unterstützt werden.

# Translations for checking the arguments definition for subcommands.
Error arg def subcommand id:
  en: >
    Error: The subcommand with the identifier "$1" does not use a valid Bash
    identifier.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" nutzt keinen validen
    Bash-Identifikator.

Error arg def subcommand subcommand:
  en: >
    Error: The subcommand with the identifier "$1" has a nested subcommand
    defined, which is not supported.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" hat ein verschachteltes
    Subkommando definiert, was nicht unterstützt wird.

Error arg def subcommand short name:
  en: >
    Error: The subcommand with the identifier "$1" has a short option name
    defined, while only value names are supported.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" hat einen kurzen
    Optionsnamen definiert, während nur Wertnamen unterstützt werden.

Error arg def subcommand long name:
  en: >
    Error: The subcommand with the identifier "$1" has a long option name
    defined, while only value names are supported.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" hat einen langen
    Optionsnamen definiert, während nur Wertnamen unterstützt werden.

Error arg def subcommand value name 1:
  en: >
    Error: The subcommand with the identifier "$1" has no value name defined,
    while 1 is required.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" hat keinen Wertnamen
    definiert, während 1 erforderlich ist.

Error arg def subcommand value name 2:
  en: >
    Error: The subcommand with the identifier "$1" has $2 value names defined,
    while 1 is required.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" hat "$2" Wertnamen
    definiert, während 1 erforderlich ist.

Error arg def subcommand value name duplication:
  en: >
    Error: The subcommand with the identifier "$1" has the value name "$2"
    defined, but that is already in use by "$3".
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" hat den Wertnamen "$2"
    definiert, dieser wird aber bereits von "$3" genutzt.

Error arg def subcommand default value:
  en: >
    Error: The subcommand with the identifier "$1" has a default value defined,
    but cannot take a value.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" hat einen Vorgabewert
    definiert, kann aber keine Werte nehmen.

Error arg def subcommand choice value:
  en: >
    Error: The subcommand with the identifier "$1" has a choice value defined,
    but cannot take a value.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" hat einen Auswahlwert
    definiert, kann aber keine Werte nehmen.

Error arg def subcommand type:
  en: >
    Error: The subcommand with the identifier "$1" has a data type defined, but
    cannot take a value.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" hat einen Datentyp
    definiert, kann aber keine Werte nehmen.

Error arg def subcommand arg number:
  en: >
    Error: The subcommand with the identifier "$1" has an argument number
    defined, but cannot take a value.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" hat eine Argumentanzahl
    definiert, kann aber keine Werte nehmen.

Error arg def subcommand arg group:
  en: >
    Error: The subcommand with the identifier "$1" is defined for the argument
    group "$2", while all subcommands must belong to "$3", as defined by the
    ARGPARSER_SUBCOMMAND_GROUP.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" ist für die
    Argumentgruppe "$2" definiert, während alle Subkommandos zu "$3" gehören
    müssen, wie durch die ARGPARSER_SUBCOMMAND_GROUP definiert ist.

Error arg def subcommand note:
  en: >
    Error: The subcommand with the identifier "$1" has "$2" given as note,
    but only "deprecated" and "hidden" are supported.
  de: >
    Fehler: Das Subkommando mit dem Identifikator "$1" hat "$2" als Anmerkung
    gegeben, aber nur "deprecated" ("veraltet") und "hidden" ("versteckt")
    werden unterstützt.

Warning arg def subcommand help text:
  en: >
    Warning: The subcommand with the identifier "$1" has no help text defined,
    but for user-friendliness, defining one is recommended.
  de: >
    Warnung: Das Subkommando mit dem Identifikator "$1" hat keinen Hilfetext
    definiert, zwecks Benutzerfreundlichkeit ist es aber empfohlen, einen zu
    definieren.

# Translations for checking the arguments definition for positional arguments.
Error arg def pos id:
  en: >
    Error: The positional argument with the identifier "$1" does not use a
    valid Bash identifier.
  de: >
    Fehler: Das positionale Argument mit dem Identifikator "$1" nutzt keinen
    validen Bash-Identifikator.

Error arg def pos subcommand:
  en: >
    Error: The positional argument with the identifier "$1" has more than one
    subcommand defined, which is not supported.
  de: >
    Fehler: Das positionale Argument mit dem Identifikator "$1" hat mehr als
    ein Subkommando definiert, was nicht unterstützt wird.

Error arg def pos default value flag:
  en: >
    Error: The positional argument with the identifier "$1" must have its
    default value set to "true" or "false" (as it is allowed to take 0 values),
    but has {$2} defined.
  de: >
    Fehler: Das positionale Argument mit dem Identifikator "$1" muss den
    Vorgabewert auf "wahr" ("true") oder "falsch" ("false") gesetzt haben (da
    es 0 Werte nehmen darf), hat aber {$2} definiert.

Error arg def pos default value 1:
  en: >
    Error: The positional argument with the identifier "$1" requires 1 value,
    but has $2 given as default values.
  de: >
    Fehler: Das positionale Argument mit dem Identifikator "$1" erfordert 1
    Wert, hat aber $2 als Vorgabewerte gegeben.

Error arg def pos default value 2:
  en: >
    Error: The positional argument with the identifier "$1" requires $2 values,
    but has $3 given as default values.
  de: >
    Fehler: Das positionale Argument mit dem Identifikator "$1" erfordert $2
    Werte, hat aber $3 als Vorgabewerte gegeben.

Error arg def pos choice value true false:
  en: >
    Error: The positional argument with the identifier "$1" has {$2} given as
    choice values, while "true" and "false" cannot be any.
  de: >
    Fehler: Das positionale Argument mit dem Identifikator "$1" hat {$2} als
    Auswahlwerte gegeben, während "wahr" ("true") und "falsch" ("false") keine
    sein können.

Error arg def pos choice value default:
  en: >
    Error: The positional argument with the identifier "$1" accepts only the
    choice values {$2}, but has {$3} given as default values.
  de: >
