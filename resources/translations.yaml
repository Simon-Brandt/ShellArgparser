# Translations for parsing the arguments.
Error arg double hyphen:
  en: >
    Error: The special option "--" takes no value.
  de: >
    Fehler: Die besondere Option "--" nimmt keinen Wert.

Error arg double plus:
  en: >
    Error: The special option "++" takes no value.
  de: >
    Fehler: Die besondere Option "++" nimmt keinen Wert.

Error arg inversion:
  en: >
    Error: Inverting flags with a "+" prefix is deactivated.
  de: >
    Fehler: Flags mit einem "-"-Präfix zu invertieren ist deaktiviert.

Error arg unknown:
  en: >
    Error: The argument "$1" is unknown.
  de: >
    Fehler: Das Argument "$1" ist unbekannt.

# Translations for parsing the long options.
Error long option match:
  en: >
    Error: The long option "$1" matches multiple long options.
  de: >
    Fehler: Die lange Option "$1" passt auf mehrere lange Optionen.

Error long option negation:
  en: >
    Error: The long option "$1" is negated, but its affirmative version "$2" is
    unknown.
  de: >
    Fehler: Die lange Option "$1" ist negiert, ihre bejahende Version "$2" ist
    aber unbekannt.

Error long option unknown:
  en: >
    Error: The long option "$1" is unknown.
  de: >
    Fehler: Die lange Option "$1" ist unbekannt.

# Translations for parsing the short options.
Error short option merge:
  en: >
    Error: The short option "$1$2" is unknown.
  de: >
    Fehler: Die kurze Option "$1$2" ist unbekannt.

Error short option unknown:
  en: >
    Error: The short option "$1" is unknown.
  de: >
    Fehler: Die kurze Option "$1" ist unbekannt.

# Translations for parsing the positional arguments.
Error pos arg count 1:
  en: >
    Error: 1 positional argument is required, but $1 are given.
  de: >
    Fehler: 1 positionales Argument ist erforderlich, aber $1 sind gegeben.

Error pos arg count 2:
  en: >
    Error: $1 positional arguments are required, but 1 is given.
  de: >
    Fehler: $1 positionale Argumente sind erforderlich, aber 1 ist gegeben.

Error pos arg count 3:
  en: >
    Error: $1 positional arguments are required, but $2 are given.
  de: >
    Fehler: $1 positionale Argumente sind erforderlich, aber $2 sind gegeben.

# Translations for checking the values of the arguments.
Error arg subcommand 1:
  en: >
    Error: The argument "$1" is known, but defined for the subcommand "$2",
    which is not given.
  de: >
    Fehler: Das Argument "$1" ist bekannt, aber für das Subkommando "$2"
    definiert, das nicht gegeben ist.

Error arg subcommand 2:
  en: >
    Error: The argument "$1" is known, but not defined for the given subcommand
    "$2".
  de: >
    Fehler: Das Argument "$1" ist bekannt, aber für das gegebene Subkommando
    "$2" nicht definiert.

Warning deprecation:
  en: >
    Warning: The argument "$1" is deprecated and will be removed in the future.
  de: >
    Warnung: Das Argument "$1" ist veraltet und wird in Zukunft entfernt.

Error arg no flag 1:
  en: >
    Error: The option "$1" is no flag and thus needs a value after the option
    name.
  de: >
    Fehler: Die Option "$1" ist kein Flag und kann benötigt daher einen Wert
    nach dem Optionsnamen.

Error arg no flag 2:
  en: >
    Error: The option "$1" is not used as a flag (it has a value given) and
    thus cannot be given with a "+" or "{$2}-" prefix.
  de: >
    Fehler: Die Option "$1" wird nicht als Flag genutzt (sie hat einen Wert
    gegeben) und kann daher nicht mit einem "+"- oder "{$2}-"-Präfix gegeben
    werden.

Error arg no flag 3:
  en: >
    Error: The option "$1" is no flag and thus cannot be given with a "+" or
    "{$2}-" prefix.
  de: >
    Fehler: Die Option "$1" ist kein Flag und kann daher nicht mit einem
    "+"- oder "{$2}-"-Präfix gegeben werden.

Error mandatory arg:
  en: >
    Error: The argument "$1" is mandatory, but not given.
  de: >
    Fehler: Das Argument "$1" ist erforderlich, aber nicht gegeben.

Error wrong arg number 1:
  en: >
    Error: The argument "$1" requires at least 1 value, but has $2 given.
  de: >
    Fehler: Das Argument "$1" erfordert mindestens 1 Wert, hat aber $2 gegeben.

Warning wrong arg number 1:
  en: >
    Warning: The argument "$1" requires at least 1 value, but has $2
    given.  For convenience, the default ($3) is used.
  de: >
    Warnung: Das Argument "$1" erfordert mindestens 1 Wert, hat aber $2
    gegeben.  Zwecks Benutzerfreundlichkeit wird die Vorgabe ($3) genutzt.

Error wrong arg number 2:
  en: >
    Error: The argument "$1" requires 0 or 1 value, but has $2 given.
  de: >
    Fehler: Das Argument "$1" erfordert 0 oder 1 Wert, hat aber $2 gegeben.

Warning wrong arg number 2:
  en: >
    Warning: The argument "$1" requires 0 or 1 value, but has $2 given.  For
    convenience, the default ($3) is used.
  de: >
    Warnung: Das Argument "$1" erfordert 0 oder 1 Wert, hat aber $2
    gegeben.  Zwecks Benutzerfreundlichkeit wird die Vorgabe ($3) genutzt.

Error wrong arg number 3:
  en: >
    Error: The argument "$1" requires 1 value, but has $2 given.
  de: >
    Fehler: Das Argument "$1" erfordert 1 Wert, hat aber $2 gegeben.

Warning wrong arg number 3:
  en: >
    Warning: The argument "$1" requires 1 value, but has $2 given.  For
    convenience, the default ($3) is used.
  de: >
    Warnung: Das Argument "$1" erfordert 1 Wert, hat aber $2 gegeben.  Zwecks
    Benutzerfreundlichkeit wird die Vorgabe ($3) genutzt.

Error wrong arg number 4:
  en: >
    Error: The argument "$1" requires $2 values, but has $3 given.
  de: >
    Fehler: Das Argument "$1" erfordert $2 Werte, hat aber $3 gegeben.

Warning wrong arg number 4:
  en: >
    Warning: The argument "$1" requires $2 values, but has $3 given.  For
    convenience, the default ($4) is used.
  de: >
    Warnung: Das Argument "$1" erfordert $2 Werte, hat aber $3 gegeben.  Zwecks
    Benutzerfreundlichkeit wird die Vorgabe ($4) genutzt.

Error arg choice:
  en: >
    Error: The argument "$1" must be in {$2}, but is {$3}.
  de: >
    Fehler: Das Argument "$1" muss in {$2} liegen, ist aber {$3}.

Error arg bool:
  en: >
    Error: The argument "$1" is set to "$2", but must be a Boolean, i.e.,
    "true" or "false".
  de: >
    Fehler: Das Argument "$1" ist auf "$2" gesetzt, muss aber ein boolscher
    Wert (Boolean) sein, d. h. "wahr" ("true") oder "falsch" ("false").

Error arg char:
  en: >
    Error: The argument "$1" is set to "$2", but must be a character, i.e., a
    string comprising one printable ASCII character.
  de: >
    Fehler: Das Argument "$1" ist auf "$2" gesetzt, muss aber ein
    einzelnes Zeichen sein, d. h. eine Zeichenkette aus einem druckbaren
    ASCII-Zeichen.

Error arg float:
  en: >
    Error: The argument "$1" is set to "$2", but must be a floating-point
    number, i.e., comprise only digits, a dot, and possibly a leading sign.
  de: >
    Fehler: Das Argument "$1" ist auf "$2" gesetzt, muss aber eine
    Gleitkommazahl sein, d. h. nur Ziffern, einen Punkt, und ggf. ein
    Vorzeichen umfassen.

Error arg int:
  en: >
    Error: The argument "$1" is set to "$2", but must be an integer, i.e.,
    comprise only digits and possibly a leading sign.
  de: >
    Fehler: Das Argument "$1" ist auf "$2" gesetzt, muss aber eine
    Ganzzahl sein, d. h. nur Ziffern und ggf. ein Vorzeichen umfassen.

Error arg uint:
  en: >
    Error: The argument "$1" is set to "$2", but must be an unsigned integer,
    i.e., comprise only digits and no sign.
  de: >
    Fehler: Das Argument "$1" ist auf "$2" gesetzt, muss aber eine
    natürliche Zahl sein, d. h. nur Ziffern und kein Vorzeichen umfassen.
